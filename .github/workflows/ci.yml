name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Single root lockfile (npm workspaces): one npm ci at the root installs the
# whole workspace tree, exactly as the Dockerfiles do. legacy-peer-deps comes
# from the root .npmrc.
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [back-end, front-end, property-boundaries-service]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build --if-present -w apps/${{ matrix.app }}
      - name: Type-check
        run: npm run typecheck --if-present -w apps/${{ matrix.app }}
      - name: Test
        run: npm run test --if-present -w apps/${{ matrix.app }}

  # Dockerfile lint + image CVE scan (technology-and-infrastructure#171).
  # DL3018 (pin apk versions) is ignored because pinned alpine packages
  # disappear from the repos and break builds and Alpine should be kept updated
  # Trivy reports fixable HIGH+CRITICAL but only CRITICAL fails the job
  # The FE build needs its required build args - dummy vals fine for scanning
  docker-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [back-end, front-end, property-boundaries-service]
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/${{ matrix.app }}/Dockerfile
          ignore: DL3018,DL3008
      - name: Build image
        run: >
          docker build -f apps/${{ matrix.app }}/Dockerfile . -t ${{ matrix.app }}:scan
          --build-arg NODE_VERSION=24
          --build-arg CADDY_HOSTNAME=ci-scan.invalid
          --build-arg VITE_OS_KEY=ci-scan
          --build-arg VITE_GEOCODER_TOKEN=ci-scan
          --build-arg VITE_MAPBOX_TOKEN=ci-scan
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.72.0
          cache: true
      - name: Trivy report (HIGH+CRITICAL, non-blocking)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ matrix.app }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true
      - name: Trivy gate (CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ matrix.app }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
          trivyignores: .trivyignore
